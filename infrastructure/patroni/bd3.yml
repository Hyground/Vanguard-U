scope: vanguard-cluster
name: bd3
namespace: /service/

etcd:
  host: 34.68.197.98:2379
  protocol: http

restapi:
  listen: 0.0.0.0:8008
  connect_address: 34.29.234.240:8008

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        archive_mode: "on"
        archive_command: mkdir -p ../wal_archive && test ! -f ../wal_archive/%f && cp %p ../wal_archive/%f
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10
        hot_standby: "on"
      pg_hba:
        - host all all 0.0.0.0/0 md5
        - host replication repl_user_svc 0.0.0.0/0 md5
        - host all postgres 34.45.194.127/32 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 34.29.234.240:5432
  data_dir: /data/patroni
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: repl_user_svc
      password: Kj82_mP91_Xz77_Rt
    superuser:
      username: postgres
      password: Kj82_mP91_Xz77_Rt
  pg_hba:
    - host all postgres 34.45.194.127/32 md5
    - host all all 0.0.0.0/0 md5
    - host replication repl_user_svc 34.45.194.127/32 md5
    - host replication repl_user_svc 0.0.0.0/0 md5
  parameters:
    unix_socket_directories: '/var/run/postgresql'
