services:
  # Cache
  redis-cache:
    image: bitnami/redis:latest
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=Kj82_mP91_Xz77_Rt
    volumes:
      - ./redis_data:/bitnami/redis

  # Mensajeria
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=vanguard_user
      - RABBITMQ_DEFAULT_PASS=Kj82_mP91_Xz77_Rt

  # Monitoreo - PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: always
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://bd2equipomari:Kj82_mP91_Xz77_Rt@34.68.197.98:5000/bdedu?sslmode=disable

  # Monitoreo - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus

  # Monitoreo - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
