name: k6 load test

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to run"
        required: true
        default: "load-tests/vanguard-read-baseline.js"
        type: choice
        options:
          - load-tests/vanguard-read-baseline.js
          - load-tests/vanguard-stress.js
      base_url:
        description: "API base URL"
        required: true
        default: "https://api.wissegt.com"

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          docker run --rm \
            -e BASE_URL="${BASE_URL}" \
            -v "${PWD}:/work" \
            -w /work \
            grafana/k6 run "${{ inputs.script }}"
