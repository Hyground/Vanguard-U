server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: academic-ms
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:vps.wissegt.com}:${DB_PORT:5432}/${DB_NAME:bdedu}
    username: ${DB_USERNAME:bd2equipomari}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.vanguard.academic: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
