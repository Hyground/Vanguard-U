# --- SERVER CONFIGURATION ---
server.port=${ACADEMIC_PORT:8082}

# --- SPRING CORE CONFIGURATION ---
spring.application.name=academic-ms
# Importación opcional del archivo .env (asegúrate de que la ruta ../../env/ sea correcta)
spring.config.import=optional:file:../../env/.env[.properties]

# --- DATASOURCE CONFIGURATION (WRITE REPLICA / MAIN DB) ---
# Se agregó "localhost" como fallback del host y la clave "Kj82..." para que no falle si falta el .env
spring.datasource.url=jdbc:postgresql://${DB_WRITE_HOST:${DB_HOST:localhost}}:${DB_WRITE_PORT:${DB_PORT:5432}}/${DB_NAME:bdedu}
spring.datasource.username=${DB_USERNAME:bd2equipomari}
spring.datasource.password=${DB_PASSWORD:Kj82_mP91_Xz77_Rt}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIKARI CONNECTION POOL ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# --- JPA / HIBERNATE CONFIGURATION ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- SQL INIT & MIGRATION TOOLS ---
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false

# --- REDIS / CACHE CONFIGURATION ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:Kj82_mP91_Xz77_Rt}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000}
spring.data.redis.repositories.enabled=false

spring.cache.type=redis
spring.cache.redis.time-to-live=${ACADEMIC_CACHE_TTL_MS:300000}
spring.cache.redis.cache-null-values=false

# --- APP SPECIFIC ---
app.datasource.read-replica.enabled=${ACADEMIC_READ_REPLICA_ENABLED:true}

# --- LOGGING ---
logging.level.com.vanguard.academic=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- ACTUATOR / MONITORING ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true