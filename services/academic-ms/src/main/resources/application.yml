server:
  port: ${ACADEMIC_PORT:8082}

spring:
  application:
    name: academic-ms
  config:
    import: "optional:file:../../env/.env[.properties]"
  
  datasource:
    url: jdbc:postgresql://${DB_WRITE_HOST:${DB_HOST:vps.wissegt.com}}:${DB_WRITE_PORT:${DB_PORT:5432}}/${DB_NAME:bdedu}
    username: ${DB_USERNAME:bd2equipomari}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
    
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:vps.wissegt.com}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:2000}

  cache:
    type: redis
    redis:
      time-to-live: ${ACADEMIC_CACHE_TTL_MS:300000}
      cache-null-values: false

logging:
  level:
    com.vanguard.academic: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
