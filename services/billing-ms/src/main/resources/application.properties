spring.application.name=billing-ms
server.port=${BILLING_PORT:8084}

spring.config.import=optional:file:../../env/.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_WRITE_HOST:${DB_HOST:vps.wissegt.com}}:${DB_WRITE_PORT:${DB_PORT:5432}}/${DB_NAME:bdedu}
spring.datasource.username=${DB_USERNAME:bd2equipomari}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
