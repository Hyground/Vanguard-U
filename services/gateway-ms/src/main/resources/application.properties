server.port=${GATEWAY_PORT:8080}
spring.application.name=gateway-ms

spring.config.import=optional:file:../../env/.env[.properties]

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:Kj82_mP91_Xz77_Rt}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000}

spring.cloud.gateway.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.default-filters[0].args.key-resolver=#{@clientIpKeyResolver}
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.replenishRate=${GATEWAY_RATE_LIMIT_REPLENISH_RATE:50}
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.burstCapacity=${GATEWAY_RATE_LIMIT_BURST_CAPACITY:100}
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.requestedTokens=${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

# --- ROUTES CONFIGURATION ---

# 1. USERS MS
spring.cloud.gateway.routes[0].id=users-ms
spring.cloud.gateway.routes[0].uri=${USERS_MS_URL:http://100.125.236.96:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**

# 2. ACADEMIC MS
spring.cloud.gateway.routes[1].id=academic-ms
spring.cloud.gateway.routes[1].uri=${ACADEMIC_MS_URL:http://100.91.4.45:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/school-cycles/**,/api/v1/majors/**,/api/v1/classrooms/**,/api/v1/courses/**,/api/v1/grades/**,/api/v1/sections/**,/api/v1/study-plans/**,/api/v1/shifts/**,/api/v1/bimonthly-units/**,/api/v1/teachers/**

# 3. STUDENT MS
spring.cloud.gateway.routes[2].id=student-and-enrollment-ms
spring.cloud.gateway.routes[2].uri=${STUDENT_MS_URL:http://100.105.17.78:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/students/**,/api/v1/enrollments/**,/api/v1/activities/**,/api/v1/attendance/**,/api/v1/grades-records/**,/api/v1/schedules/**,/api/v1/teacher-assignments/**,/api/v1/tutors/**

# 4. BILLING MS
spring.cloud.gateway.routes[3].id=billing-ms
spring.cloud.gateway.routes[3].uri=${BILLING_MS_URL:http://100.119.91.28:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/billing/**

# --- MONITORING ROUTES ---

# 5. USERS MONITORING
spring.cloud.gateway.routes[4].id=users-monitoring
spring.cloud.gateway.routes[4].uri=${USERS_MS_URL:http://100.125.236.96:8081}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/monitoring/users/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/v1/monitoring/users/(?<segment>.*), /actuator/$\{segment}

# 6. ACADEMIC MONITORING
spring.cloud.gateway.routes[5].id=academic-monitoring
spring.cloud.gateway.routes[5].uri=${ACADEMIC_MS_URL:http://100.91.4.45:8082}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/monitoring/academic/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/v1/monitoring/academic/(?<segment>.*), /actuator/$\{segment}

# 7. STUDENT MONITORING
spring.cloud.gateway.routes[6].id=student-monitoring
spring.cloud.gateway.routes[6].uri=${STUDENT_MS_URL:http://100.105.17.78:8083}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/monitoring/student/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/api/v1/monitoring/student/(?<segment>.*), /actuator/$\{segment}

# 8. BILLING MONITORING
spring.cloud.gateway.routes[7].id=billing-monitoring
spring.cloud.gateway.routes[7].uri=${BILLING_MS_URL:http://100.119.91.28:8084}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/monitoring/billing/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/api/v1/monitoring/billing/(?<segment>.*), /actuator/$\{segment}

# --- MANAGEMENT & METRICS ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true


logging.level.org.springframework.cloud.gateway=INFO
