server.port=${SERVER_PORT:8080}
spring.application.name=gateway-ms

spring.cloud.gateway.routes[0].id=users-ms
spring.cloud.gateway.routes[0].uri=${USERS_MS_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/roles/**

spring.cloud.gateway.routes[1].id=academic-ms
spring.cloud.gateway.routes[1].uri=${ACADEMIC_MS_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/academic-cycles/**, /api/v1/school-cycles/**, /api/v1/careers/**, /api/v1/majors/**, /api/v1/classrooms/**, /api/v1/courses/**, /api/v1/grades/**, /api/v1/sections/**, /api/v1/study-plans/**, /api/v1/shifts/**, /api/v1/bimonthly-units/**, /api/v1/teachers/**

spring.cloud.gateway.routes[2].id=student-and-enrollment-ms
spring.cloud.gateway.routes[2].uri=${STUDENT_MS_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/students/**, /api/v1/enrollments/**, /api/v1/activities/**, /api/v1/attendance/**, /api/v1/grades-records/**, /api/v1/schedules/**, /api/v1/teacher-assignments/**, /api/v1/tutors/**

spring.cloud.gateway.routes[3].id=billing-ms
spring.cloud.gateway.routes[3].uri=${BILLING_MS_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/billing/**

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.org.springframework.cloud.gateway=INFO
